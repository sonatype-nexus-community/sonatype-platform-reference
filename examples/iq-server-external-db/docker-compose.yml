# INFO 7 --- [           main] c.s.i.b.s.InsightBrainSpringApplication  : No active profile set, falling back to 1 default profile: "default"
# INFO 7 --- [           main] .s.i.b.s.c.DropwizardConfigConfiguration : Loading configuration from /etc/nexus-iq-server/config.yml
# WARN 7 --- [           main] .s.i.b.s.c.DropwizardConfigConfiguration : HDS URL not configured, some features may not work
# INFO 7 --- [           main] c.s.i.b.s.c.RequestLoggingConfiguration  : Configuring access-event request log with 1 appender(s)
# INFO 7 --- [           main] o.s.b.j.s.JettyServletWebServerFactory   : Server initialized with port: 8070
# INFO 7 --- [           main] org.eclipse.jetty.server.Server          : jetty-12.1.10; built: 2026-05-31T04:45:52.925Z; git: 986024525891c2c20ff08c58ba300dc3b9847586; jvm 25.0.3+9-LTS
# INFO 7 --- [           main] b.w.c.s.WebApplicationContextInitializer : Root WebApplicationContext: initialization completed in 1864 ms
# INFO 7 --- [           main] c.s.i.b.s.config.DatabaseConfiguration   : Initializing database container
